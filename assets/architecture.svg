<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">CUA-JEV closed-loop architecture</title>
  <desc id="desc">A task adapter observes structured state and creates typed actions. Jev chooses one. A guard dispatches it to GUI or structured tools. A verifier checks the result and returns new state to the adapter.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#fff9f2"/></linearGradient>
    <linearGradient id="jev" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23486c"/><stop offset="1" stop-color="#2d6b80"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#17344d" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#b56f4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="388" rx="28" fill="url(#canvas)" stroke="#d8e6ed" stroke-width="2"/>
  <text x="38" y="47" fill="#a45c3d" font-size="16" font-weight="700" font-family="Arial, sans-serif" letter-spacing="3">CUA-JEV · ONE VERIFIED DECISION LOOP</text>
  <g filter="url(#shadow)">
    <rect x="38" y="78" width="263" height="182" rx="20" fill="#fff" stroke="#ccdee8"/>
    <rect x="338" y="78" width="213" height="182" rx="20" fill="url(#jev)"/>
    <rect x="588" y="78" width="264" height="182" rx="20" fill="#fff" stroke="#ccdee8"/>
    <rect x="889" y="78" width="273" height="182" rx="20" fill="#eaf7f1" stroke="#c0dfcf"/>
  </g>
  <path d="M310 169h18M560 169h18M861 169h18" stroke="#b56f4a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="61" y="120" fill="#a45c3d" font-size="15" font-weight="700" font-family="Arial, sans-serif">01 · TASK ADAPTER</text>
  <text x="61" y="158" fill="#1d3951" font-size="27" font-weight="700" font-family="Georgia, serif">Observe &amp; propose</text>
  <text x="61" y="192" fill="#50647a" font-size="17" font-family="Arial, sans-serif">Structured state + legal</text>
  <text x="61" y="218" fill="#50647a" font-size="17" font-family="Arial, sans-serif">intent × route candidates</text>
  <text x="362" y="120" fill="#a8dcd1" font-size="15" font-weight="700" font-family="Arial, sans-serif">02 · JEV CHOICE</text>
  <text x="362" y="158" fill="#fff" font-size="29" font-weight="700" font-family="Georgia, serif">Select one</text>
  <text x="362" y="192" fill="#e6f3f5" font-size="17" font-family="Arial, sans-serif">A typed decision,</text>
  <text x="362" y="218" fill="#e6f3f5" font-size="17" font-family="Arial, sans-serif">not a generated script</text>
  <text x="611" y="120" fill="#a45c3d" font-size="15" font-weight="700" font-family="Arial, sans-serif">03 · RUNTIME</text>
  <text x="611" y="158" fill="#1d3951" font-size="27" font-weight="700" font-family="Georgia, serif">Guard &amp; execute</text>
  <text x="611" y="192" fill="#50647a" font-size="17" font-family="Arial, sans-serif">GUI · DOM · COM · CLI</text>
  <text x="611" y="218" fill="#50647a" font-size="17" font-family="Arial, sans-serif">MCP · API · script</text>
  <text x="912" y="120" fill="#3a8064" font-size="15" font-weight="700" font-family="Arial, sans-serif">04 · VERIFIER</text>
  <text x="912" y="158" fill="#1d3951" font-size="27" font-weight="700" font-family="Georgia, serif">Check the state</text>
  <text x="912" y="192" fill="#50647a" font-size="17" font-family="Arial, sans-serif">Independent predicate</text>
  <text x="912" y="218" fill="#50647a" font-size="17" font-family="Arial, sans-serif">+ evidence trace</text>
  <path d="M1033 273v61H169v-61" fill="none" stroke="#8fb3b2" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="471" y="314" width="258" height="39" rx="19" fill="#fff" stroke="#cbdfe5"/>
  <text x="600" y="340" text-anchor="middle" fill="#31596d" font-size="16" font-weight="700" font-family="Arial, sans-serif">RE-OBSERVE · REPEAT</text>
</svg>
