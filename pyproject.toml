[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cua-jev"
version = "0.1.0"
description = "A typed, verifiable Jev action router for hybrid Windows computer use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CUA-JEV contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
windows = ["pywin32>=306", "pywinauto>=0.6.9"]
browser = ["playwright>=1.48"]
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
all = ["pywin32>=306", "pywinauto>=0.6.9", "playwright>=1.48", "mcp>=1,<2"]

[project.scripts]
cua-jev = "cua_jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
